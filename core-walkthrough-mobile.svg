<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 340 520"><title id="title">Read, check and extend the compact evidence</title><desc id="desc">Read the accompanying answer, source links and negative controls for the evidence boundary.</desc><g fill="#172f4d" font-family="system-ui" font-size="16"><rect x="10" y="15" width="320" height="135" rx="8" fill="#edf4fa" stroke="#172f4d"/><text x="170" y="53" text-anchor="middle">Read the compact source</text><text x="170" y="80" text-anchor="middle">3 typed documents</text><text x="170" y="107" text-anchor="middle">Exact Markdown and digests</text><path d="M170 150V188m-6-8 6 8 6-8" fill="none" stroke="#172f4d" stroke-width="2"/><rect x="10" y="195" width="320" height="135" rx="8" fill="#edf4fa" stroke="#172f4d"/><text x="170" y="233" text-anchor="middle">Check the citations</text><text x="170" y="260" text-anchor="middle">Zero graph relationships</text><text x="170" y="287" text-anchor="middle">Keep the source scope</text><path d="M170 330V368m-6-8 6 8 6-8" fill="none" stroke="#172f4d" stroke-width="2"/><rect x="10" y="375" width="320" height="135" rx="8" fill="#edf4fa" stroke="#172f4d"/><text x="170" y="413" text-anchor="middle">Retrieve further evidence</text><text x="170" y="440" text-anchor="middle">Coverage or full graph</text><text x="170" y="467" text-anchor="middle">Declare the new scope</text></g></svg>
