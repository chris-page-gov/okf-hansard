name: OKF Hansard CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: Core validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.4"
          python-version: "3.12"
          enable-cache: false
      - name: Run locked Python tests
        env:
          PYTHONPATH: scripts
        run: uv run --locked python -m unittest discover -s tests
      - name: Check browser script syntax
        run: |
          for script in docs/pages/*.js; do
            node --input-type=module --check < "$script"
          done

  validate:
    name: okf-hansard-ci
    needs: [core, security, browser]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful core, security and browser validation
        env:
          CORE_RESULT: ${{ needs.core.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: test "$CORE_RESULT" = success && test "$SECURITY_RESULT" = success && test "$BROWSER_RESULT" = success

  security:
    name: Security checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.4"
          python-version: "3.12"
          enable-cache: false
      - name: Scan tracked source for secrets
        shell: bash
        run: |
          mkdir "$RUNNER_TEMP/hansard-source" "$RUNNER_TEMP/gitleaks"
          curl -fsSL --max-time 60 --proto '=https' --proto-redir '=https' \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/gitleaks" gitleaks
          git archive HEAD | tar -x -C "$RUNNER_TEMP/hansard-source"
          "$RUNNER_TEMP/gitleaks/gitleaks" dir --redact=100 --no-banner "$RUNNER_TEMP/hansard-source"
      - name: Audit locked Python dependencies
        run: |
          uv export --locked --no-dev --no-emit-project --output-file "$RUNNER_TEMP/hansard-requirements.txt"
          uv tool run --from pip-audit==2.10.1 pip-audit --strict --require-hashes --disable-pip \
            --progress-spinner off --cache-dir "$RUNNER_TEMP/pip-audit-cache" \
            --requirement "$RUNNER_TEMP/hansard-requirements.txt"

  browser:
    name: Keyboard and source links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.4"
          python-version: "3.12"
          enable-cache: false
      - name: Install Chromium
        run: uv run --locked --with playwright==1.65.2 playwright install --with-deps --only-shell chromium
      - name: Check the rendered tour at phone and desktop widths
        env:
          PYTHONPATH: scripts
        run: uv run --locked --with playwright==1.65.2 python tests/browser_acceptance.py
